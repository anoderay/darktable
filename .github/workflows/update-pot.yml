# Nightly regeneration of po/darktable.pot, the template Weblate reads.
#
# IMPORTANT: intltool-update -pot cannot run on a bare checkout. po/POTFILES.in
# lists generated sources under build/ (introspection_*.c, conf_gen.h,
# preferences_gen.h, styles_string.h, masks_group_presets_strings.h,
# darktable_authors.h, org.darktable.darktable.desktop.in). These only exist
# after a CMake configure + build, so we build darktable first and only then
# run intltool-update -pot from po/ (it looks for ../build).
#
# Only the POT is committed. The per-language PO files stay owned by Weblate
# and are not touched here.
#
# Dependency list and build mirror the Linux job in .github/workflows/ci.yml.

name: Update POT

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pot
  cancel-in-progress: false

jobs:
  update-pot:
    # Block scheduled runs on forks, but still allow a fork owner to test via
    # "Run workflow" (manual dispatch). Same guard darktable uses elsewhere.
    if: github.repository == 'darktable-org/darktable' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get --yes install \
            build-essential cmake ninja-build \
            appstream-util desktop-file-utils gettext intltool \
            libarchive-dev libatk1.0-dev libavif-dev libcairo2-dev \
            libcmocka-dev libcolord-dev libcolord-gtk-dev libcups2-dev \
            libcurl4-gnutls-dev libexiv2-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libgmic-dev libgphoto2-dev libgraphicsmagick1-dev \
            libgtk-3-dev libheif-dev libjpeg-dev libjson-glib-dev liblcms2-dev \
            liblensfun-dev liblua5.4-dev libonnxruntime-dev \
            libopencv-calib3d-dev libopencv-core-dev libopencv-features2d-dev \
            libopencv-flann-dev libopencv-imgproc-dev libopenexr-dev \
            libopenjp2-7-dev libosmgpsmap-1.0-dev libpango1.0-dev libpng-dev \
            libportmidi-dev libpotrace-dev libpugixml-dev libraw-dev \
            librsvg2-dev libsaxon-java libsdl2-dev libsecret-1-dev \
            libsqlite3-dev libtiff5-dev libwebp-dev libx11-dev libxml2-dev \
            libxml2-utils perl po4a python3-jsonschema xsltproc zlib1g-dev

      - name: Fetch build submodules
        run: |
          # Init all submodules, but skip the large integration-test repo
          # (same as ci.yml). The submodule name carries the src/ prefix.
          git submodule init
          git config submodule.src/tests/integration.update none
          git submodule update

      - name: Configure and build (generates the files POTFILES.in needs)
        run: |
          # intltool-update looks for ../build relative to po/, so the build
          # tree must sit at the repository root and be named "build".
          cmake -S . -B build -G Ninja -DBUILD_TESTING=OFF
          cmake --build build

      - name: Generate POT
        working-directory: po
        run: |
          intltool-update -pot
          test -s darktable.pot

      - name: Check whether any translatable string changed
        id: diff
        run: |
          # Line references (#:) and the creation date change on every run.
          # Ignore them, so we only commit on real string changes.
          git show HEAD:po/darktable.pot > "$RUNNER_TEMP/old.pot" 2>/dev/null || : > "$RUNNER_TEMP/old.pot"
          norm() { grep -v -e '^#:' -e '^"POT-Creation-Date:' "$1" || true; }
          if diff -q <(norm "$RUNNER_TEMP/old.pot") <(norm po/darktable.pot) > /dev/null; then
            echo "No string changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- po/darktable.pot 2>/dev/null || true
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push POT
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add po/darktable.pot
          git commit -m "Update po/darktable.pot [skip ci]"
          git push origin HEAD:master
